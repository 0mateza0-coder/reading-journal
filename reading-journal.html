<title>สมุดบันทึกการอ่าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: a two-column desk — today's entry form on the left, the shelf of past entries and due reviews on the right; stacks on phones. */
:root {
  --bg: #f3f5f1;
  --paper: #ffffff;
  --ink: #1d2a28;
  --muted: #5d6b67;
  --line: #d9dfd9;
  --accent: #2f6b5e;
  --accent-soft: #e2eee9;
  --due: #a8641a;
  --due-soft: #f8ecdc;
  --display: "Noto Serif Thai", Georgia, serif;
  --body: "IBM Plex Sans Thai", "Sarabun", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141a19; --paper: #1c2422; --ink: #e4ebe8; --muted: #9aa8a3; --line: #2f3a37;
  --accent: #7cc2ae; --accent-soft: #22362f; --due: #e3a457; --due-soft: #3a2c1a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141a19; --paper: #1c2422; --ink: #e4ebe8; --muted: #9aa8a3; --line: #2f3a37;
  --accent: #7cc2ae; --accent-soft: #22362f; --due: #e3a457; --due-soft: #3a2c1a; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.65; padding: 0 16px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 48px; display: grid; gap: 24px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
h1 { font-family: var(--display); font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0; line-height: 1.3; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.stats { display: flex; gap: 20px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--display); font-size: 1.5rem; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat span { font-size: .8rem; color: var(--muted); }

.cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }

form { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 18px; }
h2 { font-family: var(--display); font-size: 1.15rem; margin: 0; }
fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 12px; }
legend { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; padding: 0; margin-bottom: 8px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
label { display: grid; gap: 4px; font-size: .88rem; font-weight: 500; min-width: 0; }
label small { font-weight: 400; color: var(--muted); }
input, textarea, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 72px; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.points { display: grid; gap: 8px; counter-reset: p; }
.points input { padding-left: 34px; }
.points div { position: relative; }
.points div::before { counter-increment: p; content: counter(p); position: absolute; left: 11px; top: 9px; color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
.scale { display: flex; gap: 6px; flex-wrap: wrap; }
.scale label { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-weight: 400; }
.scale input { width: auto; margin: 0; accent-color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; font-weight: 400; }
.check input { width: auto; accent-color: var(--accent); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button { font: inherit; cursor: pointer; border-radius: 6px; padding: 8px 16px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); font-weight: 600; }
button.small { padding: 4px 10px; font-size: .82rem; }
.msg { font-size: .85rem; color: var(--muted); }

aside { display: grid; gap: 20px; min-width: 0; }
.due-box { background: var(--due-soft); border-radius: 10px; padding: 16px 18px; display: grid; gap: 10px; }
.due-box h2 { color: var(--due); }
.due-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.due-item p { margin: 0; min-width: 0; }
.list { display: grid; gap: 12px; }
.entry { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 6px; min-width: 0; }
.entry-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.entry h3 { margin: 0; font-family: var(--display); font-size: 1.02rem; }
.meta { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.entry ol { margin: 0; padding-left: 20px; }
.entry p { margin: 0; overflow-wrap: anywhere; }
.entry .lbl { font-size: .75rem; color: var(--muted); font-weight: 600; }
.chip { font-size: .72rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
.chip.due { background: var(--due-soft); color: var(--due); }
.chip.example { background: var(--line); color: var(--muted); }
.entry-actions { display: flex; gap: 8px; justify-content: flex-end; }
.empty { color: var(--muted); font-size: .9rem; }
.note { font-size: .8rem; color: var(--muted); }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>สมุดบันทึกการอ่าน</h1>
      <p class="sub">อ่านแล้วสรุปด้วยคำพูดของตัวเอง ระบบจะเตือนให้ทบทวนในวันที่ 1, 3, 7 และ 30</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="sStreak">0</b><span>วันติดต่อกัน</span></div>
      <div class="stat"><b id="sPages">0</b><span>หน้าทั้งหมด</span></div>
      <div class="stat"><b id="sMin">0</b><span>นาทีทั้งหมด</span></div>
    </div>
  </header>

  <div class="cols">
    <form id="f" autocomplete="off">
      <h2 id="formTitle">บันทึกวันนี้</h2>

      <fieldset>
        <legend>ก่อนอ่าน</legend>
        <div class="row">
          <label>วันที่<input type="date" id="date" required></label>
          <label>ชื่อหนังสือ<input id="book" required placeholder="เช่น Atomic Habits"></label>
        </div>
        <div class="row">
          <label>บท / หัวข้อ<input id="chapter" placeholder="บทที่ 3"></label>
          <label>หน้า (จาก)<input type="number" id="pFrom" min="0" inputmode="numeric"></label>
          <label>หน้า (ถึง)<input type="number" id="pTo" min="0" inputmode="numeric"></label>
          <label>เวลา (นาที)<input type="number" id="minutes" min="0" inputmode="numeric"></label>
        </div>
        <label>คำถามที่อยากได้คำตอบจากการอ่านครั้งนี้<input id="goal" placeholder="บทนี้จะอธิบายเรื่องอะไร"></label>
      </fieldset>

      <fieldset>
        <legend>หลังอ่าน · ปิดหนังสือก่อนเขียน</legend>
        <label>ประเด็นสำคัญ 3 ข้อ <small>เขียนจากความจำ ไม่เปิดหนังสือดู</small></label>
        <div class="points">
          <div><input id="k1" aria-label="ประเด็นที่ 1"></div>
          <div><input id="k2" aria-label="ประเด็นที่ 2"></div>
          <div><input id="k3" aria-label="ประเด็นที่ 3"></div>
        </div>
        <label>สรุปด้วยคำพูดของตัวเอง <small>อธิบายให้เด็กเข้าใจได้</small><textarea id="summary"></textarea></label>
        <label>ยังไม่เข้าใจ / สงสัยตรงไหน<textarea id="questions" rows="2"></textarea></label>
        <label>จะนำไปใช้หรือเชื่อมกับสิ่งที่รู้อย่างไร<textarea id="apply" rows="2"></textarea></label>
        <label>คำคมหรือประโยคที่ชอบ<input id="quote"></label>
      </fieldset>

      <fieldset>
        <legend>ประเมินตัวเอง</legend>
        <div class="scale" role="radiogroup" aria-label="ระดับความเข้าใจ">
          <span class="note" style="align-self:center">ความเข้าใจ</span>
        </div>
        <label class="check"><input type="checkbox" id="recall"> ปิดหนังสือแล้วทวนออกมาได้</label>
      </fieldset>

      <div class="actions">
        <button class="primary" type="submit" id="saveBtn">บันทึก</button>
        <button type="button" id="cancelBtn" hidden>ยกเลิกการแก้ไข</button>
        <span class="msg" id="msg" role="status"></span>
      </div>
    </form>

    <aside>
      <div class="due-box" id="dueBox" hidden>
        <h2>ถึงรอบทบทวนวันนี้</h2>
        <div id="dueList" class="list"></div>
      </div>
      <div class="list">
        <h2>บันทึกที่ผ่านมา</h2>
        <div id="entries" class="list"></div>
      </div>
      <p class="note" id="storeNote"></p>
    </aside>
  </div>
</div>

<script>
const INTERVALS = [1, 3, 7, 30];
const $ = id => document.getElementById(id);
const FIELDS = ["date","book","chapter","pFrom","pTo","minutes","goal","k1","k2","k3","summary","questions","apply","quote"];

// rating radios
const scale = document.querySelector(".scale");
for (let i = 1; i <= 5; i++) {
  const l = document.createElement("label");
  l.innerHTML = `<input type="radio" name="rating" id="r${i}" value="${i}"> ${i}`;
  scale.appendChild(l);
}

const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayStr = () => ymd(new Date());
const addDays = (s, n) => { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); };
const fmt = s => new Date(s + "T00:00:00").toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit" });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const EXAMPLE = {
  id: "example", example: true, date: todayStr(), book: "Atomic Habits", chapter: "บทที่ 1", pFrom: 1, pTo: 24, minutes: 30,
  goal: "ทำไมนิสัยเล็ก ๆ ถึงสำคัญ",
  k1: "ดีขึ้นวันละ 1% ผ่านไปหนึ่งปีจะดีขึ้นราว 37 เท่า", k2: "ระบบสำคัญกว่าเป้าหมาย", k3: "ผลลัพธ์มาช้า ต้องผ่านช่วงที่ยังไม่เห็นผล",
  summary: "การเปลี่ยนแปลงเล็ก ๆ ที่ทำทุกวันจะสะสมจนเห็นผลใหญ่ คนส่วนใหญ่เลิกก่อนถึงจุดที่ผลเริ่มปรากฏ",
  questions: "จะวัดความก้าวหน้า 1% ได้อย่างไร", apply: "อ่านหนังสือวันละ 10 หน้าทุกคืนก่อนนอน", quote: "",
  rating: 4, recall: true, step: 0, nextReview: todayStr()
};

let entries = [];
let editingId = null;

// ---------- storage: db (per-person, private) with localStorage fallback ----------
const LS = "reading-journal-entries";
const store = {
  mode: "local", col: null,
  async init(onChange) {
    try {
      const lsRead = () => { try { return JSON.parse(localStorage.getItem(LS) || "[]"); } catch { return []; } };
      entries = lsRead(); onChange();
      const claudeObj = window.claude;
      if (!claudeObj?.use) { this.note(); return; }
      const [db, user] = await Promise.all([claudeObj.use("db"), claudeObj.use("user")]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) { this.note(); return; }
      this.col = db.collection("data/users/" + uid);
      this.mode = "db";
      this.note();
      this.col.onSnapshot(snap => {
        entries = snap.docs.map(d => ({ ...d.data(), id: d.id }));
        onChange();
      }, () => { this.mode = "local"; this.note(); });
    } catch { this.note(); }
  },
  note() {
    $("storeNote").textContent = this.mode === "db"
      ? "บันทึกเก็บไว้ในบัญชีของคุณ เห็นได้เฉพาะคุณเท่านั้น"
      : "บันทึกเก็บไว้ในเบราว์เซอร์นี้เท่านั้น";
  },
  async save(e) {
    if (this.mode === "db") { const { id, ...body } = e; await this.col.doc(id).set(body); return; }
    const i = entries.findIndex(x => x.id === e.id);
    if (i >= 0) entries[i] = e; else entries.push(e);
    try { localStorage.setItem(LS, JSON.stringify(entries)); } catch {}
    render();
  },
  async remove(id) {
    if (this.mode === "db") { await this.col.doc(id).delete(); return; }
    entries = entries.filter(x => x.id !== id);
    try { localStorage.setItem(LS, JSON.stringify(entries)); } catch {}
    render();
  }
};

// ---------- render ----------
function stats() {
  const pages = entries.reduce((s, e) => s + (e.pTo && e.pFrom != null && e.pTo >= e.pFrom ? e.pTo - e.pFrom + 1 : 0), 0);
  const mins = entries.reduce((s, e) => s + (+e.minutes || 0), 0);
  const days = new Set(entries.map(e => e.date));
  let streak = 0, d = todayStr();
  if (!days.has(d)) d = addDays(d, -1);
  while (days.has(d)) { streak++; d = addDays(d, -1); }
  $("sStreak").textContent = streak; $("sPages").textContent = pages.toLocaleString("th-TH"); $("sMin").textContent = mins.toLocaleString("th-TH");
}

function reviewChip(e) {
  if (e.step >= INTERVALS.length) return `<span class="chip">ทบทวนครบแล้ว</span>`;
  if (e.nextReview <= todayStr()) return `<span class="chip due">ถึงรอบทบทวน</span>`;
  return `<span class="chip">ทบทวน ${fmt(e.nextReview)}</span>`;
}

function card(e) {
  const pages = e.pFrom || e.pTo ? `หน้า ${e.pFrom ?? "?"}–${e.pTo ?? "?"}` : "";
  const bits = [fmt(e.date), e.chapter, pages, e.minutes ? e.minutes + " นาที" : "", e.rating ? "เข้าใจ " + e.rating + "/5" : ""].filter(Boolean).join(" · ");
  const pts = [e.k1, e.k2, e.k3].filter(Boolean);
  return `<article class="entry">
    <div class="entry-head"><h3>${esc(e.book)}</h3>${e.example ? '<span class="chip example">ตัวอย่าง</span>' : reviewChip(e)}</div>
    <div class="meta">${esc(bits)}</div>
    ${pts.length ? `<ol>${pts.map(p => `<li>${esc(p)}</li>`).join("")}</ol>` : ""}
    ${e.summary ? `<p>${esc(e.summary)}</p>` : ""}
    ${e.questions ? `<p><span class="lbl">สงสัย:</span> ${esc(e.questions)}</p>` : ""}
    ${e.apply ? `<p><span class="lbl">นำไปใช้:</span> ${esc(e.apply)}</p>` : ""}
    ${e.quote ? `<p><span class="lbl">ประโยคที่ชอบ:</span> “${esc(e.quote)}”</p>` : ""}
    ${e.example ? "" : `<div class="entry-actions"><button class="small" data-edit="${e.id}">แก้ไข</button><button class="small" data-del="${e.id}">ลบ</button></div>`}
  </article>`;
}

let pendingDelete = null;
function render() {
  stats();
  const sorted = [...entries].sort((a, b) => (b.date + (b.created || "")).localeCompare(a.date + (a.created || "")));
  $("entries").innerHTML = sorted.length
    ? sorted.map(card).join("")
    : `<p class="empty">ยังไม่มีบันทึก กรอกฟอร์มแล้วกด “บันทึก” รายการแรกจะขึ้นที่นี่ ด้านล่างเป็นตัวอย่าง</p>` + card(EXAMPLE);

  const due = entries.filter(e => e.step < INTERVALS.length && e.nextReview <= todayStr());
  $("dueBox").hidden = !due.length;
  $("dueList").innerHTML = due.map(e => `<div class="due-item">
      <p><b>${esc(e.book)}</b> ${esc(e.chapter || "")}<br><span class="meta">รอบที่ ${e.step + 1} จาก ${INTERVALS.length} · ลองนึกประเด็นสำคัญก่อนกดดู</span></p>
      <button class="small" data-done="${e.id}">ทบทวนแล้ว</button></div>`).join("");

  if (pendingDelete) {
    const btn = document.querySelector(`[data-del="${pendingDelete}"]`);
    if (btn) btn.textContent = "กดอีกครั้งเพื่อลบ";
  }
}

// ---------- form ----------
function resetForm() {
  $("f").reset(); editingId = null;
  $("date").value = todayStr();
  $("formTitle").textContent = "บันทึกวันนี้"; $("saveBtn").textContent = "บันทึก"; $("cancelBtn").hidden = true;
}

$("f").addEventListener("submit", async ev => {
  ev.preventDefault();
  const prev = entries.find(x => x.id === editingId);
  const e = prev ? { ...prev } : { id: "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), created: new Date().toISOString(), step: 0 };
  for (const k of FIELDS) {
    const v = $(k).value.trim();
    e[k] = ["pFrom", "pTo", "minutes"].includes(k) ? (v === "" ? null : +v) : v;
  }
  const r = document.querySelector('input[name="rating"]:checked');
  e.rating = r ? +r.value : null;
  e.recall = $("recall").checked;
  if (!prev) e.nextReview = addDays(e.date, INTERVALS[0]);
  try {
    await store.save(e);
    $("msg").textContent = prev ? "แก้ไขแล้ว" : "บันทึกแล้ว ทบทวนครั้งแรก " + fmt(e.nextReview);
    resetForm();
  } catch (err) {
    $("msg").textContent = err?.code === "quota_exceeded" ? "พื้นที่เต็ม ลองลบบันทึกเก่าบางรายการ" : "บันทึกไม่สำเร็จ ลองกดบันทึกอีกครั้ง";
  }
});

$("cancelBtn").addEventListener("click", () => { resetForm(); $("msg").textContent = ""; });

document.addEventListener("click", async ev => {
  const t = ev.target;
  if (t.dataset.edit) {
    const e = entries.find(x => x.id === t.dataset.edit); if (!e) return;
    editingId = e.id;
    for (const k of FIELDS) $(k).value = e[k] ?? "";
    document.querySelectorAll('input[name="rating"]').forEach(r => r.checked = +r.value === e.rating);
    $("recall").checked = !!e.recall;
    $("formTitle").textContent = "แก้ไขบันทึก"; $("saveBtn").textContent = "บันทึกการแก้ไข"; $("cancelBtn").hidden = false;
    $("f").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  } else if (t.dataset.del) {
    if (pendingDelete !== t.dataset.del) { pendingDelete = t.dataset.del; render(); return; }
    pendingDelete = null;
    try { await store.remove(t.dataset.del); } catch { $("msg").textContent = "ลบไม่สำเร็จ ลองอีกครั้ง"; }
  } else if (t.dataset.done) {
    const e = entries.find(x => x.id === t.dataset.done); if (!e) return;
    const next = { ...e, step: e.step + 1 };
    if (next.step < INTERVALS.length) next.nextReview = addDays(todayStr(), INTERVALS[next.step] - INTERVALS[e.step]);
    try { await store.save(next); } catch { $("msg").textContent = "บันทึกไม่สำเร็จ ลองอีกครั้ง"; }
  } else if (pendingDelete) { pendingDelete = null; render(); }
});

resetForm();
render();
store.init(render);
</script>
